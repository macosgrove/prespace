<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Force Graph | PreSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
  <div id="three-d-graph"></div>

  <!-- UI Overlay -->
  <div class="ui-overlay">
    <header>
      <h1>PreSpace <span>3D</span></h1>
      <p>Interactive Force-Directed Graph</p>
    </header>

    <div class="controls-panel" id="controls-panel">
      <div class="panel-header">
        <span class="panel-title">Stats & Controls</span>
        <button id="minimize-btn" class="btn-icon" title="Toggle Panel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m18 15-6-6-6 6" />
          </svg>
        </button>
      </div>

      <div class="panel-content">
        <div class="control-group-row">
          <div class="stat-item">
            <span class="label">Nodes:</span>
            <span id="node-count" class="value">0</span>
          </div>
          <div class="stat-item">
            <span class="label">Links:</span>
            <span id="link-count" class="value">0</span>
          </div>
        </div>

        <div class="control-section">
          <div class="label">Growth Speed</div>
          <div class="slider-container">
            <span class="slider-label">Slow</span>
            <input type="range" id="speed-slider" min="10" max="2000" step="10" value="1000">
            <span class="slider-label">Fast</span>
          </div>
        </div>

        <div class="control-section">
          <div class="label">Edges per Tick</div>
          <div class="input-container">
            <input type="number" id="edges-per-tick" min="1" max="50" step="1" value="1">
          </div>
        </div>

        <div class="control-group-row">
          <button id="reset-btn" class="btn btn-secondary btn-icon-only" title="Reset View">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
          <button id="toggle-dynamic" class="btn btn-primary btn-icon-only" title="Pause Growth">
            <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="4" width="4" height="16" />
              <rect x="14" y="4" width="4" height="16" />
            </svg>
            <svg id="play-icon" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
          </button>
          <button id="step-btn" class="btn btn-secondary btn-icon-only" title="Step">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 4 15 12 5 20 5 4" />
              <line x1="19" y1="5" x2="19" y2="19" />
            </svg>
          </button>
          <button id="clear-btn" class="btn btn-secondary btn-icon-only" title="Clear graph">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18" />
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
              <line x1="10" y1="11" x2="10" y2="17" />
              <line x1="14" y1="11" x2="14" y2="17" />
            </svg>
          </button>
        </div>
        <div class="hint">
          <p>Click a node to remove it • Drag to rotate • Scroll to zoom</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
